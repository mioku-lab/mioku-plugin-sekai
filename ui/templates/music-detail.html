{{HEAD}}
<section class="glass music-shell">
  <div class="music-top">
    <div class="music-jacket"><img class="img-cover" src="{{JACKET}}" alt="{{TITLE}}"/></div>
    <div class="music-copy">
      <div class="eyebrow">Music #{{MUSIC_ID}}</div>
      <h2 class="music-title">{{TITLE}}</h2>
      {{ORIGINAL}}
      <div class="music-meta glass-soft">
        {{META_ROWS}}
      </div>
      <div class="music-tags">{{TAGS}}</div>
    </div>
  </div>
  <div class="difficulty-heading"><span>谱面难度</span><small>DIFFICULTY</small></div>
  <div class="difficulty-grid">{{DIFF_TILES}}</div>
</section>
<div class="footer-note">✦ MUSIC ARCHIVE · {{ARTIST}}</div>
