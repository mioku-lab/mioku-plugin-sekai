<div class="event-detail-head"><div class="brand-mark">HATSUNE MIKU: COLORFUL STAGE!</div></div>
<div class="event-detail-layout">
  <section class="event-copy">
    <h1 class="event-title">{{TITLE}}</h1>
    {{JAPANESE}}
    <div class="event-badges">{{STATUS_BADGE}} {{TYPE_BADGE}}<span class="event-id">Event #{{EVENT_ID}}</span></div>
    <div class="event-timeline glass-soft">
      <div class="timeline-title">时间</div>
      <div class="timeline-grid">{{TIMELINE_ROWS}}</div>
      <div class="timeline-range">{{RANGE}}</div>
    </div>
  </section>
  <div class="event-visual glass"><img class="img-cover" src="{{IMAGE}}" alt="{{TITLE}}" onerror="this.style.opacity='.2'"/></div>
</div>
{{RANKING_PANEL}}
<div class="footer-note">✦ EVENT ARCHIVE · {{UNIT}} ✦</div>
